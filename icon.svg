<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="inoxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3540" />
      <stop offset="25%" stop-color="#4a5568" />
      <stop offset="45%" stop-color="#718096" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="55%" stop-color="#718096" />
      <stop offset="80%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>

    <linearGradient id="inoxReflect" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#inoxBg)" />
  <rect width="512" height="512" rx="120" fill="url(#inoxReflect)" />
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.3" />

  <path d="M 70 120 A 210 210 0 0 1 442 120" fill="none" stroke="#121826" stroke-width="50" stroke-linecap="round" opacity="0.8" filter="url(#dropShadow)" />
  <path d="M 70 120 A 210 210 0 0 1 442 120" fill="none" stroke="#263347" stroke-width="44" stroke-linecap="round" />

  <g transform="translate(100, 108) scale(0.65)" stroke="#00e5ff" stroke-width="3" fill="none">
    <circle cx="0" cy="0" r="14" stroke-width="4"/>
    <circle cx="0" cy="0" r="8" />
  </g>

  <g transform="translate(175, 70) scale(0.65)" stroke="#ff9f43" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M -10,12 L -10,0 A 12,12 0 0,1 2,-12 L 14,-12" />
  </g>

  <g transform="translate(256, 54) scale(0.6)" stroke="#a55eea" stroke-width="3" fill="none">
    <ellipse cx="0" cy="0" rx="16" ry="6" transform="rotate(30)" />
    <ellipse cx="0" cy="0" rx="16" ry="6" transform="rotate(-30)" />
    <circle cx="0" cy="0" r="4" fill="#a55eea" />
  </g>

  <g transform="translate(337, 70) scale(0.65)" stroke="#2ecc71" stroke-width="3" fill="none" stroke-linejoin="round">
    <path d="M -10,12 L 12,12 L 12,-10 Z" />
  </g>

  <g transform="translate(412, 108) scale(0.65)" stroke="#ff5252" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="0" y1="-12" x2="0" y2="10" />
    <line x1="-8" y1="-8" x2="8" y2="-8" />
    <path d="M -8,4 L 0,10 L 8,4" />
  </g>

  <path d="M160,380 L160,290 A110,110 0 0,1 270,180 L360,180" fill="none" stroke="#000000" stroke-width="48" stroke-linecap="round" opacity="0.5" filter="url(#dropShadow)" />
  <path d="M160,375 L160,285 A110,110 0 0,1 271,175 L360,175" fill="none" stroke="url(#cyanGlow)" stroke-width="42" stroke-linecap="round" filter="url(#glowEffect)" />
  
  <g filter="url(#dropShadow)">
    <circle cx="160" cy="375" r="26" fill="#ff9f43" />
    <circle cx="360" cy="175" r="26" fill="#ff9f43" />
    <circle cx="160" cy="375" r="10" fill="#ffffff" />
    <circle cx="360" cy="175" r="10" fill="#ffffff" />
  </g>

  <path d="M210,310 L280,310 L280,240 Z" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" opacity="0.6" />
</svg>
